name: iPhone app (native)

# The native iPhone app (apps/iphone, docs/features/iphone-app.md): SwiftUI, one app per house.
# It replaces the Capacitor shell in apps/ios once it reaches TestFlight; until then this only checks it.
#
# - ERPCore (the models and the ERP's rules in Swift) is tested on Linux: no Mac minutes.
# - The app is built for the simulator on macOS and opened in its demo (made-up books, no sign-in),
#   one screenshot per tab, light and dark, printed small into the log for a reader without the artifact.
# - A line added to apps/iphone/RELEASES.md (a cloud session cannot press Run workflow) sends each house
#   whose Firebase iOS app is registered (houses.json firebase.iosAppId) to TestFlight instead.
# macOS minutes count ten to one against the Actions minutes the deploys use: it runs only for a push
# that changes apps/iphone, never for a change to the ERP.

on:
  push:
    branches: ['claude/**']
    paths: ['apps/iphone/**', '.github/workflows/iphone-native.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: Send the houses that are ready to TestFlight
        type: boolean
        default: false

concurrency:
  group: iphone-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    # gemstrack-pos carries this file too (the same history); the app is checked from here only.
    if: github.repository == 'Ammar282828/taheri-pos'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: ERPCore tests
        working-directory: apps/iphone/Packages/ERPCore
        run: swift test 2>&1 | tail -40

  plan:
    if: github.repository == 'Ammar282828/taheri-pos'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      houses: ${{ steps.plan.outputs.houses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: plan
        run: |
          release=false
          if [ "${{ inputs.testflight }}" = "true" ]; then release=true
          # A new line in the list asks for a build; making or rewording the file does not.
          elif [ "${{ github.event_name }}" = "push" ] && git diff "${{ github.event.before }}" "${{ github.sha }}" -- apps/iphone/RELEASES.md 2>/dev/null | grep -q '^+- '; then release=true; fi
          houses=$(node -e '
            const h = require("./apps/iphone/houses.json");
            const ready = Object.keys(h).filter((k) => String(h[k].firebase?.iosAppId || "").includes(":ios:"));
            for (const k of Object.keys(h)) if (!ready.includes(k)) console.error(`::notice::${h[k].storeName}: no Firebase iOS app in apps/iphone/houses.json yet (firebase.iosAppId), so it cannot sign in. Not uploaded.`);
            console.log(JSON.stringify(ready));')
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "houses=$houses" >> "$GITHUB_OUTPUT"
          echo "release=$release houses=$houses"

  app:
    needs: [core, plan]
    # A release compiles in its upload: the simulator check would spend the same Mac minutes twice.
    # With no house ready to upload, the check runs instead, so a push is never left uncompiled.
    if: needs.plan.outputs.release != 'true' || needs.plan.outputs.houses == '[]'
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/iphone
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Dress as Taheri and make the project
        run: |
          node scripts/house.mjs taheri
          xcodegen generate --spec project.yml
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ hashFiles('apps/iphone/project.yml') }}
      - name: Build for the simulator
        run: |
          xcodebuild -version
          set +e
          xcodebuild build -project ERP.xcodeproj -scheme ERP -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -skipPackagePluginValidation -skipMacroValidation ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          set -e
          # Every error once, with its file and line, then the tail for anything else.
          echo "::group::errors"; grep -E ': (error|fatal error):' "$RUNNER_TEMP/build.log" | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -150; echo "::endgroup::"
          grep -E ': warning: ' "$RUNNER_TEMP/build.log" | grep -v '/SourcePackages/\|/spm/' | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -60 || true
          tail -25 "$RUNNER_TEMP/build.log"
          exit $status
      - name: Boot a phone
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [(rt, x) for rt, xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]
          phones.sort(key=lambda p: [int(n) for n in p[0].rsplit("iOS-", 1)[-1].split("-") if n.isdigit()])
          print(phones[-1][1]["udid"]); print(phones[-1][1]["name"], phones[-1][0], file=sys.stderr)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
      - name: The demo, tab by tab
        run: |
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/ERP.app"
          ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          shot() { # name appearance [launch arguments…]
            local name=$1 look=$2; shift 2
            xcrun simctl ui "$UDID" appearance "$look"
            xcrun simctl terminate "$UDID" "$ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$ID" -ERPDemo YES "$@" >/dev/null
            sleep 5
            xcrun simctl io "$UDID" screenshot "$OUT/$name.png" >/dev/null 2>&1
          }
          i=1
          for tab in home orders invoices customers search; do shot "$i-$tab" light -ERPDemoTab "$tab"; i=$((i+1)); done
          shot "$i-home-dark" dark -ERPDemoTab home
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate "process == \"ERP\" AND messageType >= 16" 2>/dev/null | tail -40 || true
          for f in "$OUT"/*.png; do
            sips -Z 640 -s format jpeg -s formatOptions 55 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "----BEGIN $(basename "${f%.png}")----"; base64 -i "${f%.png}.jpg" | fold -w 120; echo "----END----"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-native
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/build.log
          retention-days: 14

  testflight:
    needs: [core, plan]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.houses != '[]'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        house: ${{ fromJSON(needs.plan.outputs.houses) }}
    defaults:
      run:
        working-directory: apps/iphone
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: A certificate, and profiles for the app and its widget
        run: node ../ios/scripts/asc.mjs sign-native "${{ matrix.house }}" "$RUNNER_TEMP/signing" >> "$GITHUB_ENV"
      - name: Into a keychain of its own
        run: |
          KC="$RUNNER_TEMP/erp.keychain-db"; KCPW=$(openssl rand -hex 16)
          echo "::add-mask::$KCPW"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KC" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/signing/dist.p12" -k "$KC" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            for p in app widget; do
              U=$(security cms -D -i "$RUNNER_TEMP/signing/$p.mobileprovision" | plutil -extract UUID raw -)
              cp "$RUNNER_TEMP/signing/$p.mobileprovision" "$d/$U.mobileprovision"
            done
          done
          node ../ios/scripts/asc.mjs key-file "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Dress and archive
        run: |
          node scripts/house.mjs "${{ matrix.house }}" --sign "$TEAM_ID" "$APP_PROFILE_NAME" "$WIDGET_PROFILE_NAME"
          xcodegen generate --spec project.yml
          BUILD=$(date -u +%Y%m%d.%H%M)
          echo "Build 2.0 ($BUILD)"
          set +e
          xcodebuild archive -project ERP.xcodeproj -scheme ERP -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ERP.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -skipPackagePluginValidation -skipMacroValidation \
            CURRENT_PROJECT_VERSION="$BUILD" OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" > "$RUNNER_TEMP/archive.log" 2>&1
          status=$?
          set -e
          grep -E ': (error|fatal error):|error: ' "$RUNNER_TEMP/archive.log" | sort -u | head -80 || true
          tail -15 "$RUNNER_TEMP/archive.log"
          [ $status -eq 0 ] && test -d "$RUNNER_TEMP/ERP.xcarchive"
      - name: Upload to TestFlight
        run: |
          BUNDLE=$(node -p "require('./houses.json')['${{ matrix.house }}'].bundleId")
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE</key><string>$APP_PROFILE_NAME</string>
              <key>$BUNDLE.widget</key><string>$WIDGET_PROFILE_NAME</string>
            </dict>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ERP.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::${{ matrix.house }}: the native app (2.0) is uploaded; TestFlight offers it once Apple has processed it (about 10 to 30 minutes)"
      - name: Revoke this build's certificate and profiles
        if: always()
        run: |
          node ../ios/scripts/asc.mjs revoke || true
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-archive-log-${{ matrix.house }}
          path: ${{ runner.temp }}/archive.log
          retention-days: 7
