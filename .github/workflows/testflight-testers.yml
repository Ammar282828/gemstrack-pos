name: TestFlight testers

# Who tests a house's iPhone app (docs/features/iphone-app.md): its "Shop" group in TestFlight, every build.
# A tester is an App Store Connect user with the least role TestFlight takes (Marketing), seeing that house's
# app only (apps/ios/scripts/asc.mjs testers). Apple emails them an invitation; once they accept, the next
# run adds them to the group (the daily one below, or another by hand), and every build reaches them.
#
# - By hand ("Run workflow", or a cloud session through the API): the house and the emails. The emails are
#   typed in, never committed: gemstrack-pos, which carries this history, is public.
# - Daily: each house's sweep, so whoever accepted since is added without their email being typed again.

on:
  workflow_dispatch:
    inputs:
      house:
        description: Whose app
        type: choice
        options: [taheri, mina]
        required: true
      emails:
        description: Emails to make testers (comma-separated)
        type: string
        required: true
  schedule:
    - cron: '17 5 * * *'
  # A cloud session cannot press Run workflow (403) and must not commit an email (gemstrack-pos is public): it opens
  # an issue here (private) titled "testers <house>" with the emails as its body; the job reads it, then closes it.
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  testers:
    # gemstrack-pos carries this file too; the key is here only.
    if: github.repository == 'Ammar282828/taheri-pos' && (github.event_name != 'issues' || startsWith(github.event.issue.title, 'testers '))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          HOUSE: ${{ inputs.house || (github.event_name == 'issues' && (contains(github.event.issue.title, 'mina') && 'mina' || 'taheri')) || '' }}
          EMAILS: ${{ inputs.emails || github.event.issue.body }}
        run: |
          if [ -n "$HOUSE" ]; then
            node apps/ios/scripts/asc.mjs testers "$HOUSE" "$EMAILS"
          else
            for h in taheri mina; do node apps/ios/scripts/asc.mjs testers "$h" "" || echo "::warning::$h: testers not swept"; done
          fi
      - name: Close the request
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --comment "Done (${{ job.status }})."
