name: TestFlight status

# Why a build is or is not in TestFlight (docs/features/iphone-app.md, Xcode Cloud): each house's newest builds,
# their processing and beta state, and whether the "Shop" group has them (apps/ios/scripts/asc.mjs builds).
# A cloud session cannot dispatch it (403): a push that changes this file runs it (last: compile 5d7904f3, 11-03 14h).
# With fix (the default, and on a push to this file): the newest valid build joins Shop, export compliance answered.

# Every day (schedule): the same pass. (Until 2026-11-02 keep-fresh started an Xcode Cloud build of a 60-day-old build, so
# TestFlight's 90-day expiry never reaches the shop's phones (blind-spot audit 2026-10-20).

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      fix:
        description: Add the newest build to Shop
        type: boolean
        default: true
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/testflight-status.yml']

permissions:
  contents: read

jobs:
  status:
    # gemstrack-pos carries this file too; the key is here only.
    if: github.repository == 'Ammar282828/taheri-pos'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          FIX: ${{ (github.event_name != 'workflow_dispatch' || inputs.fix) && '1' || '' }}
          EVENT: ${{ github.event_name }}
          # The job's own token: GitHub's API allows 60 unauthenticated reads an hour per address, and the shared runners run out.
          GH_TOKEN: ${{ github.token }}
        run: |
          # House of Mina's own app is retired (owner, 2026-10-20: "stop developing the house of mina app"): only the
          # one ERP app is put in TestFlight, and Mina's Xcode Cloud workflows are kept switched off.
          node apps/ios/scripts/asc.mjs builds taheri ${FIX:+--fix} || echo "::warning::taheri failed"
          # Whether Xcode Cloud ran the iPhone release for the newest release line (none came for 10-30's).
                    # Not on a push to this file (that run only reports); the daily run and "Run workflow" keep the build fresh.
          # Freshness (TestFlight's 90-day expiry) is testflight-free.yml's monthly run now; keep-fresh started Xcode Cloud.
          node apps/ios/scripts/asc.mjs ci-off mina || echo "::warning::Mina's Xcode Cloud workflows not switched off"
          # TestFlight comes from GitHub since 2026-11-02 (testflight-free.yml, gemstrack-pos): Taheri's Xcode Cloud workflows stay off too,
          # or when its hours renew they would build the same release lines again with lower numbers.
          node apps/ios/scripts/asc.mjs ci-off taheri || echo "::warning::Taheri's Xcode Cloud workflows not switched off"
          # The free release on gemstrack-pos (testflight-free.yml, public): its newest runs and, for each, the failed step.
          for wf in swift-compile.yml testflight-free.yml; do echo "== $wf"; curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/Ammar282828/gemstrack-pos/actions/workflows/$wf/runs?per_page=3" | node -e '
            let d=""; process.stdin.on("data",c=>d+=c).on("end",async()=>{
              for (const r of JSON.parse(d).workflow_runs||[]) {
                console.log(`#${r.run_number} ${r.head_sha.slice(0,8)} ${r.event} ${r.status}/${r.conclusion||"-"} ${r.created_at} ${r.html_url}`);
                const j = await (await fetch(r.jobs_url, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}` } })).json();
                for (const job of j.jobs||[]) for (const st of job.steps||[]) if (st.conclusion==="failure"||st.status==="in_progress") console.log(`   ${st.status}/${st.conclusion||"-"}: ${st.name}`);
                if (r.run_number === (JSON.parse(d).workflow_runs[0]||{}).run_number) for (const job of j.jobs||[]) {
                  const an = await (await fetch(`https://api.github.com/repos/Ammar282828/gemstrack-pos/check-runs/${job.id}/annotations`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}` } })).json().catch(()=>[]);
                  for (const a of (Array.isArray(an)?an:[]).slice(0,30)) console.log(`   annotation ${a.annotation_level}: ${a.path}:${a.start_line} ${a.message}`.slice(0,400));
                  const lg = await fetch(`https://api.github.com/repos/Ammar282828/gemstrack-pos/actions/jobs/${job.id}/logs`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}` } });
                  if (lg.ok) { const t=(await lg.text()).split("\n"); console.log(t.filter(l=>/error:|fatal error|BUILD FAILED|ARCHIVE FAILED|\*\*/.test(l)).slice(-60).join("\n")); }
                  else console.log(`   (job log: HTTP ${lg.status})`);
                }
              }
            });' || echo "::warning::could not read gemstrack-pos runs"; done
