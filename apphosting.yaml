# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
#
# THIS IS TAHERI'S. It was forked from House of Mina's and every value in it had
# to be turned over, because the defaults baked into src/lib/firebase.ts all point
# at hom-pos-52710474-ceeea. Deployed unchanged, this app signs in against House
# of Mina's project and reads and writes House of Mina's database while showing
# Taheri's name on the door. Check the project id below before touching anything
# else in this file.
#
# Shopify and the WhatsApp (GreenAPI) transport are deliberately absent: Taheri
# does not use either, and its own env records SHOPIFY_API_KEY as "unused".
# Adding House of Mina's credentials here would wire this shop to that shop's
# storefront and phone number.

runConfig:
  minInstances: 0

env:
  # whatsapp-web.js (local-only dev tool) pulls puppeteer. Skip the Chromium
  # download during the cloud build - it is never used in production.
  - variable: PUPPETEER_SKIP_DOWNLOAD
    value: "true"
    availability:
      - BUILD

  # Where this app actually answers. The hosted.app address still works and still
  # serves the same backend, but this is the one printed on documents and used to
  # build links, so it should be the address the shop actually says out loud.
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://pos.taheri.shop"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAl3W_9_Z9j0sR7rGIwwM1uiiXvOxGQ7IA"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "gemstrack-pos.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "gemstrack-pos"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "gemstrack-pos.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "948018742883"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:948018742883:web:a3a090dde378be96089a56"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_NAME
    value: "TAHERI"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_DEFAULT_METAL
    value: "gold"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_ALLOWED_EMAILS
    value: "potatomasta501@gmail.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_WHATSAPP_URL
    value: "https://wa.me/923262275554"
    availability:
      - BUILD
      - RUNTIME


  # Gates the notification endpoints, which Cloud Scheduler calls without a user
  # session. Its own value in this project, not shared with the other shop.
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME

# Vertex AI needs no key: the backend signs its own requests with the service account
# it already runs as. GOOGLE_GENAI_API_KEY is gone from here for that reason, not by
# oversight -- the API-key endpoint bills to a separate AI Studio pool, which is what
# was empty. The secret still exists in the project if anything ever wants it back.

  # ██ TEMPORARY: removes the sign-in screen on the deployed app ██
  # Set 2026-09-07 at Ammar's request, paired with open firestore.rules.
  # Delete this block and restore firestore.rules.locked to close it again.
  - variable: NEXT_PUBLIC_OPEN_ACCESS
    value: "1"
    availability:
      - BUILD
      - RUNTIME

  # WhatsApp, through Green API. Deliberately the SAME instance House of Mina uses --
  # the shop runs one bot across both stores and its own env says so ("same as Mina --
  # shared bot"), so messages from either shop go out from the one number. That is the
  # arrangement, not an accident of copying: change it only if Taheri gets its own line.
  #
  # RUNTIME only. Read per request in src/lib/whatsapp.ts, never at build.
  - variable: GREENAPI_ID_INSTANCE
    secret: GREENAPI_ID_INSTANCE
    availability:
      - RUNTIME
  - variable: GREENAPI_API_TOKEN
    secret: GREENAPI_API_TOKEN
    availability:
      - RUNTIME
  # The link page the printed QR points at, and what it lists. Anything left empty is
  # simply not shown on the page -- a row that goes nowhere is worse than no row.
  - variable: NEXT_PUBLIC_STORE_WEBSITE_URL
    value: "https://taheri.shop"
    availability:
      - BUILD
      - RUNTIME

  # ── Selling from taheri.shop ──────────────────────────────────────────────
  # The public site quotes and checks out through /api/public/*. WEBSITE_ORIGIN
  # is the one origin those routes answer to, and where the catalogue's
  # attributes are read from. Leopards is optional: without its two secrets the
  # order page takes a consignment number by hand.
  - variable: WEBSITE_ORIGIN
    value: https://taheri.shop
    availability: [RUNTIME]
  - variable: LEOPARDS_API_KEY
    secret: LEOPARDS_API_KEY
    availability: [RUNTIME]
  - variable: LEOPARDS_API_PASSWORD
    secret: LEOPARDS_API_PASSWORD
    availability: [RUNTIME]
  - variable: LEOPARDS_USE_SANDBOX
    value: "false"
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_STORE_INSTAGRAM_URL
    value: "https://www.instagram.com/collectionstaheri"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_LINKS_URL
    value: "https://links.taheri.shop"
    availability:
      - BUILD
      - RUNTIME

