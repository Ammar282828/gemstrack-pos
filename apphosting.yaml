# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

env:
  # whatsapp-web.js (local-only dev tool) pulls puppeteer. Skip the Chromium
  # download during the cloud build — it's never used in production.
  - variable: PUPPETEER_SKIP_DOWNLOAD
    value: "true"
    availability:
      - BUILD
  # Not a secret: project ids are public. Needed by firebase-admin so
  # verifyIdToken can check a token's audience.
  # Where the app actually answers. Every Shopify webhook is registered
  # against this, so it has to match the domain in the browser bar — if it
  # drifts, Shopify keeps posting to the old address and orders stop arriving
  # with no error anywhere. Set this to the custom domain only once DNS
  # resolves, then re-run /api/shopify/register-webhooks.
  - variable: NEXT_PUBLIC_APP_URL
    value: https://studio--hom-pos-52710474-ceeea.us-central1.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: hom-pos-52710474-ceeea
    availability:
      - BUILD
      - RUNTIME
  - variable: SHOPIFY_API_KEY
    value: 1c2467806ff47ad68ffc2cd4b9720b26
    availability:
      - RUNTIME
  - variable: SHOPIFY_API_SECRET
    secret: SHOPIFY_API_SECRET
    availability:
      - BUILD
      - RUNTIME
  - variable: GOOGLE_GENAI_API_KEY
    secret: GOOGLE_GENAI_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
  - variable: GREENAPI_ID_INSTANCE
    secret: GREENAPI_ID_INSTANCE
    availability:
      - RUNTIME
  - variable: GREENAPI_API_TOKEN
    secret: GREENAPI_API_TOKEN
    availability:
      - RUNTIME
  - variable: SHOPIFY_STORE_DOMAIN
    secret: SHOPIFY_STORE_DOMAIN
    availability:
      - RUNTIME
  - variable: SHOPIFY_ACCESS_TOKEN
    secret: SHOPIFY_ACCESS_TOKEN
    availability:
      - RUNTIME
