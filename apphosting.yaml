# Settings for Backend (on Cloud Run) — the part BOTH houses share.
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
#
# One codebase serves two shops from two Firebase projects:
#
#   Taheri          project gemstrack-pos             backend studio   environment "taheri"   pos.taheri.shop
#   House of Mina   project hom-pos-52710474-ceeea    backend studio   environment "mina"     pos.houseofmina.store
#
# App Hosting reads this file and then apphosting.<environment>.yaml for the
# backend's environment name, where a variable of the same name overrides and
# a new one is added. So: anything identical for both houses lives here; every
# difference — Firebase project, store name, contacts, logo, brand palette,
# which features the shop has — lives in apphosting.taheri.yaml or
# apphosting.mina.yaml. Never a fork of the code, never a value here that only
# one house wants (an override file can add or replace a variable; it cannot
# remove one).
#
# A `secret:` declared here must exist in BOTH projects' Secret Manager and be
# readable by each project's App Hosting service accounts, or that project's
# rollout fails. A secret only one house has goes in that house's file.

runConfig:
  minInstances: 0

env:
  # whatsapp-web.js (local-only dev tool) pulls puppeteer. Skip the Chromium
  # download during the cloud build - it is never used in production.
  - variable: PUPPETEER_SKIP_DOWNLOAD
    value: "true"
    availability:
      - BUILD

  # Gates the notification endpoints, which Cloud Scheduler calls without a user
  # session. Each project holds its own value under this name.
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME

  # WhatsApp, through WAHA (WhatsApp HTTP API) since 2026-09-25 — the shop's own
  # gateway on the `waha` VM in gemstrack-pos (ops/waha/), with +92 326 2275554
  # linked to it as a device. Deliberately the SAME line for both houses: the shop
  # runs one bot across both stores. `waha-api-key` exists in both projects with
  # the same value (the VM holds it hashed). src/lib/whatsapp.ts prefers WAHA when
  # these two are set; remove them to fall back to Green API below.
  - variable: WAHA_URL
    value: "https://35-184-20-165.sslip.io"
    availability:
      - RUNTIME
  - variable: WAHA_API_KEY
    secret: waha-api-key
    availability:
      - RUNTIME

  # Green API — the gateway before WAHA, kept configured as the fallback until
  # it is cancelled. Same line. RUNTIME only.
  - variable: GREENAPI_ID_INSTANCE
    secret: GREENAPI_ID_INSTANCE
    availability:
      - RUNTIME
  - variable: GREENAPI_API_TOKEN
    secret: GREENAPI_API_TOKEN
    availability:
      - RUNTIME
