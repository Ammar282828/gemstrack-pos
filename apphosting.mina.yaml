# House of Mina — everything that differs from Taheri. Applied on top of
# apphosting.yaml for the backend whose environment name is "mina"
# (project hom-pos-52710474-ceeea). See the header of apphosting.yaml.
#
# Mina's fork used to carry most of these as defaults baked into the code
# (store-config.ts, firebase.ts). The unified code's defaults are Taheri's, so
# every one of them is stated here: leave one out and Mina's POS comes up
# wearing the other house's name.

env:
  # ── Which house ──────────────────────────────────────────────────────────
  - variable: NEXT_PUBLIC_STORE_BRAND
    value: mina
    availability:
      - BUILD
      - RUNTIME
  # The partnership book: Shareholder Finances in the sidebar and "paid by
  # Mina/Ammar" on an expense. Mina's ledgers live in this project's Firestore
  # (mina_ledger, ammar_ledger); Taheri has none and leaves this unset.
  - variable: NEXT_PUBLIC_STORE_PARTNERSHIP
    value: "1"
    availability:
      - BUILD
      - RUNTIME
  # Mina's muted burgundy ground, for the browser chrome (globals.css .brand-mina).
  - variable: NEXT_PUBLIC_STORE_THEME_COLOR
    value: "#1C1114"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_LOGO_URL
    value: /house-of-mina-logo.png
    availability:
      - BUILD
      - RUNTIME
  # The same wordmark in off-white, for the dark palette and the links page — the
  # maroon one cannot be seen on Mina's own maroon ground.
  - variable: NEXT_PUBLIC_STORE_LOGO_LIGHT_URL
    value: /house-of-mina-logo-light.png
    availability:
      - BUILD
      - RUNTIME
  # public/house-of-mina-logo.png is 3195×646.
  - variable: NEXT_PUBLIC_STORE_LOGO_ASPECT
    value: "4.9458"
    availability:
      - BUILD
      - RUNTIME

  # ── Where it answers, and which Firebase project ─────────────────────────
  # Every Shopify webhook is registered against this, so it has to match the
  # domain in the browser bar; if it drifts, re-run /api/shopify/register-webhooks.
  - variable: NEXT_PUBLIC_APP_URL
    value: https://pos.houseofmina.store
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBJsDVAI_b7RvnSf-cpnSNLXQ-R0OH0qU4"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: hom-pos-52710474-ceeea.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: hom-pos-52710474-ceeea
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: hom-pos-52710474-ceeea.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "288366939838"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:288366939838:web:044c8eec0a5610688798ef"
    availability:
      - BUILD
      - RUNTIME

  # ── The store ────────────────────────────────────────────────────────────
  - variable: NEXT_PUBLIC_STORE_NAME
    value: MINA
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_DEFAULT_METAL
    value: silver
    availability:
      - BUILD
      - RUNTIME
  # Analytics' estimated margin; Mina's fork had 40% written into the page.
  - variable: NEXT_PUBLIC_STORE_EST_MARGIN
    value: "0.40"
    availability:
      - BUILD
      - RUNTIME
  # Who may sign in as an owner. Mina is behind sign-in; there is no open access here.
  - variable: NEXT_PUBLIC_STORE_ALLOWED_EMAILS
    value: "potatomasta501@gmail.com,minakhalid00@gmail.com,hmurtaza55@gmail.com"
    availability:
      - BUILD
      - RUNTIME
  # Counter staff, for "Taken by" on orders and invoices — ADJUST to Mina's counter.
  - variable: NEXT_PUBLIC_STORE_TAKEN_BY
    value: "Mina,Ammar,Murtaza"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_CONTACT1_NAME
    value: "Mina Khalid"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_CONTACT1_NUMBER
    value: "0316 1930960"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_CONTACT2_NAME
    value: "Ammar Mansa"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_CONTACT2_NUMBER
    value: "0326 2275554"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_BANK_LINE
    value: "Bank Al Habib  |  House of Mina"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_IBAN
    value: "PK42 BAHL 1227 0981 0022 7801"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_INSTAGRAM_URL
    value: "https://www.instagram.com/houseofmina__?igsh=aTAyZWQycWVudm43&utm_source=qr"
    availability:
      - BUILD
      - RUNTIME
  # Mina's fork pointed the WhatsApp link at the community group; kept as it was.
  - variable: NEXT_PUBLIC_STORE_WHATSAPP_URL
    value: "https://chat.whatsapp.com/GspOCiFlp3tJWiNFkLfF0H"
    availability:
      - BUILD
      - RUNTIME

  # ── Mina's own integrations ──────────────────────────────────────────────
  # Shopify: the storefront and its webhooks. Secrets live in hom-pos.
  - variable: SHOPIFY_API_KEY
    value: 1c2467806ff47ad68ffc2cd4b9720b26
    availability:
      - RUNTIME
  - variable: SHOPIFY_API_SECRET
    secret: SHOPIFY_API_SECRET
    availability:
      - BUILD
      - RUNTIME
  - variable: SHOPIFY_STORE_DOMAIN
    secret: SHOPIFY_STORE_DOMAIN
    availability:
      - RUNTIME
  - variable: SHOPIFY_ACCESS_TOKEN
    secret: SHOPIFY_ACCESS_TOKEN
    availability:
      - RUNTIME
  - variable: GOOGLE_GENAI_API_KEY
    secret: GOOGLE_GENAI_API_KEY
    availability:
      - BUILD
      - RUNTIME
  # The voice feature bills Vertex AI to Taheri's project, which has funded
  # Vertex; hom-pos has not. Its App Hosting service account holds
  # roles/aiplatform.user on gemstrack-pos. Remove once hom-pos is funded.
  - variable: VERTEX_PROJECT
    value: gemstrack-pos
    availability:
      - RUNTIME

  # ── The website: catalogue.houseofmina.store (repo mina-catalogue) ────────
  # Add Photos sends photographs there; it reads the site's own folders from
  # /catalog-tree.json. The catalogue sells at fixed prices, so there is no
  # Photo Weights page and no set of the day.
  # Investments by Taheri is Taheri's series; Mina's menu has no Investments page.
  - variable: NEXT_PUBLIC_STORE_INVESTMENTS
    value: "0"
    availability:
      - BUILD
      - RUNTIME
  # Posts → From the website: a piece from the catalogue, with its link, to the
  # House of Mina community's announcements ("House of Mina by Taheri Collections",
  # 441 members on 2026-09-25; the WAHA line +92 326 2275554 is an admin). The
  # caption closes in the house's own words; a literal \n is a line break.
  - variable: WHATSAPP_COMMUNITY_CHAT_ID
    value: "120363422611483809@g.us"
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_STORE_POST_TAGLINE
    value: "Bespoke, designed in-house."
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_POST_FOOTER
    value: '📩 DM to order — *+923161930960*\n💳 Card / Bank Transfer\n🌍 Worldwide Shipping'
    availability:
      - BUILD
      - RUNTIME
  # Post a Piece (Instagram story, community post, AI) is built on Taheri's
  # accounts; Mina's menu has no Post a Piece page and its routes answer 404.
  - variable: NEXT_PUBLIC_STORE_POST_PIECE
    value: "0"
    availability:
      - BUILD
      - RUNTIME
  # Post a Piece's marks: Mina's own logo (filled to any colour by its shape) and
  # no monogram — never Taheri's "taheri" or "t".
  - variable: NEXT_PUBLIC_STORE_MARK_SVG
    value: "/house-of-mina-logo.png"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_MONOGRAM_SVG
    value: ""
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_WEBSITE_URL
    value: https://catalogue.houseofmina.store
    availability:
      - BUILD
      - RUNTIME
  - variable: WEBSITE_ORIGIN
    value: https://catalogue.houseofmina.store
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_WEBSITE_WEIGHTS
    value: "0"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_WEBSITE_FEATURED
    value: "0"
    availability:
      - BUILD
      - RUNTIME
  # In this project's Secret Manager (App Hosting SAs have access); the same
  # value is in ~/domains/catalogue.houseofmina.store/.website-upload-secret.
  - variable: WEBSITE_UPLOAD_SECRET
    secret: website-upload-secret
