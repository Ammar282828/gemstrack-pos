# The native iPhone app (docs/features/iphone-app.md, CONVENTIONS.md). One app, many businesses since 2026-10-16: the default
# build is shop.taheri.erp, "ERP" on the home screen; `house.mjs taheri` is only its bundle and asset base. Generated into ERP.xcodeproj
# by XcodeGen after `node scripts/house.mjs <house>` has written House.xcconfig. Never commit the
# .xcodeproj: add files under App/, Shared/, Widget/ and they are in.
name: ERP
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: House.xcconfig
  Release: House.xcconfig
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2
  ERPCore:
    path: Packages/ERPCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # 2.1 from the first Xcode Cloud build (2026-10-09): its build numbers count from 1, and 2.0's were dates.
    # 2.2 from 2026-10-12: builds made on the Mac had reached 2.1 (1009), and TestFlight offers a phone only a
    # higher version or build, so Xcode Cloud's 2.1 (3) and (4) never arrived. Xcode Cloud sets the build number
    # itself; a Mac upload must not outnumber it within a version again.
    MARKETING_VERSION: "2.2"
    # CURRENT_PROJECT_VERSION is House.xcconfig's (scripts/house.mjs): Xcode Cloud's build number there.
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  App:
    type: application
    platform: iOS
    # App/Resources/PrivacyInfo.xcprivacy (the app's privacy manifest) rides in with the App path as a resource.
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: ERP
        PRODUCT_BUNDLE_IDENTIFIER: $(ERP_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: $(ERP_APPICON)
        # The merged app's alternate icons (Taheri's and Mina's; its primary is AppIcon-erp), set from Settings → This phone; empty for Mina's own deprecated app.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: $(ERP_ALT_ICONS)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent-$(ERP_HOUSE)
        PROVISIONING_PROFILE_SPECIFIER: $(ERP_APP_PROFILE)
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: ERPCore
      - target: ERPWidget
  ERPWidget:
    type: app-extension
    platform: iOS
    # Widget/PrivacyInfo.xcprivacy: the extension's own manifest (manifests are per bundle), a resource of this path.
    sources:
      - path: Widget
      - path: Shared
      - path: App/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: ERPWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(ERP_BUNDLE_ID).widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/ERPWidget.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(ERP_WIDGET_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  # The Mac app (docs/features/mac-app.md): the same app record and bundle ID as the iPhone's (a universal purchase), a
  # native macOS SwiftUI app, not Catalyst. It compiles the iPhone's App/ and Shared/ as they are (App/Platform/MacPlatform.swift
  # answers UIKit's names with AppKit's) plus Mac/: its own window, sidebar, menus, tables, menu-bar figures and Label LIVE.
  ERPMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - App.entitlements
      - path: Shared
      - path: Mac
        excludes:
          - Info.plist
          - ERPMac.entitlements
          - CUPS
          - "*.md"
    settings:
      base:
        PRODUCT_NAME: ERP
        PRODUCT_BUNDLE_IDENTIFIER: $(ERP_BUNDLE_ID)
        INFOPLIST_FILE: Mac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mac/ERPMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-mac
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent-$(ERP_HOUSE)
        COMBINE_HIDPI_IMAGES: YES
        # `import CCUPS` (Mac/CUPS/module.modulemap): raw ZPL to a printer macOS knows.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Mac/CUPS
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: ERPCore
  # The demo driven as a person would (UITests/): every place opens and stays up, the sheets most used
  # open, and launch and scrolling are timed, at today's size and at many times it (`-ERPDemoScale`).
  ERPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ERP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: App
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: App
  # The Mac's own rules, run inside the Mac app in the demo (MacTests/): Back and Forward, the sidebar per role, every
  # row opening a native page, the saved lists, the snapshot walk.
  ERPMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ERP_BUNDLE_ID).mactests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ERP.app/Contents/MacOS/ERP
        BUNDLE_LOADER: $(TEST_HOST)
        # `@testable import ERP` reads the app's module, which imports CCUPS (Mac/CUPS/module.modulemap): without its
        # path the test target's build stops at "Unable to resolve module dependency: 'CCUPS'" (the first Mac check).
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Mac/CUPS
    dependencies:
      - target: ERPMac
  # The Mac app driven as a person would, in the demo (MacUITests/): every place, Back and Forward, ⌘K, the counter's
  # windows, records in windows, the inspector, views, filters, Settings, the rate, the menus, light and dark.
  ERPMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MacUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ERP_BUNDLE_ID).macuitests
        TEST_TARGET_NAME: ERPMac
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ERPMac
schemes:
  ERP:
    build:
      targets:
        App: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ERPUITests
    archive:
      config: Release
  # Xcode Cloud's "Mac release" workflow archives this (asc.mjs mac-setup).
  ERP Mac:
    build:
      targets:
        ERPMac: all
    run:
      config: Debug
    # Xcode Cloud's "Mac check" workflow tests this (MAC-CHECKS.md): the unit tests and the UI tests, in the demo.
    test:
      config: Debug
      commandLineArguments:
        "-ERPDemo YES": true
      targets:
        - ERPMacTests
        - ERPMacUITests
    archive:
      config: Release
