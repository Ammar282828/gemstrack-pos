# The native iPhone app (docs/features/iphone-app.md, CONVENTIONS.md). One app, many businesses since 2026-10-16: the default
# build is shop.taheri.erp, "ERP" on the home screen; `house.mjs taheri` is only its bundle and asset base. Generated into ERP.xcodeproj
# by XcodeGen after `node scripts/house.mjs <house>` has written House.xcconfig. Never commit the
# .xcodeproj: add files under App/, Shared/, Widget/ and they are in.
name: ERP
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: House.xcconfig
  Release: House.xcconfig
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2
  ERPCore:
    path: Packages/ERPCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # 2.1 from the first Xcode Cloud build (2026-10-09): its build numbers count from 1, and 2.0's were dates.
    # 2.2 from 2026-10-12: builds made on the Mac had reached 2.1 (1009), and TestFlight offers a phone only a
    # higher version or build, so Xcode Cloud's 2.1 (3) and (4) never arrived. Xcode Cloud sets the build number
    # itself; a Mac upload must not outnumber it within a version again.
    MARKETING_VERSION: "2.2"
    # CURRENT_PROJECT_VERSION is House.xcconfig's (scripts/house.mjs): Xcode Cloud's build number there.
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: ERP
        PRODUCT_BUNDLE_IDENTIFIER: $(ERP_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: $(ERP_APPICON)
        # The merged app's alternate icons (Taheri's and Mina's; its primary is AppIcon-erp), set from Settings → This phone; empty for Mina's own deprecated app.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: $(ERP_ALT_ICONS)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent-$(ERP_HOUSE)
        PROVISIONING_PROFILE_SPECIFIER: $(ERP_APP_PROFILE)
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: ERPCore
      - target: ERPWidget
  ERPWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: App/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: ERPWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(ERP_BUNDLE_ID).widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/ERPWidget.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(ERP_WIDGET_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  # The demo driven as a person would (UITests/): every place opens and stays up, the sheets most used
  # open, and launch and scrolling are timed, at today's size and at many times it (`-ERPDemoScale`).
  ERPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ERP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: App
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: App
schemes:
  ERP:
    build:
      targets:
        App: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ERPUITests
    archive:
      config: Release
