// Compose stability configuration (https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file).
// `core` is a plain Kotlin/JVM module without the Compose compiler, so its types read as unstable in `app` and every
// screen taking an Order, Invoice or Customer recomposed whenever its parent did. These models are immutable data
// classes (val properties, read-only Lists, no mutable state), so they are declared stable here.
erp.core.models.*
