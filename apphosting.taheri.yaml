    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_CONTACT3_NAME
    value: "Huzaifa"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_CONTACT3_NUMBER
    value: "0335 2275553"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_CONTACT4_NAME
    value: "Ammar"
    availability:
      - BUILD
