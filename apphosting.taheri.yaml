  # The direct review link from Business Profile: it opens the star rating on the
  # Taheri Collections listing (Najmi Market, Saddar) rather than a search results
  # page, so the row does exactly what it says.
  - variable: NEXT_PUBLIC_STORE_GOOGLE_REVIEW_URL
    value: "https://g.page/r/Carl6vAff1U9EBM/review"
    availability:
      - BUILD
      - RUNTIME
  # Ads: the Instagram account Taheri's ads run as — picked automatically on
  # Ads → Setup, and any other one there is flagged as not this shop's.
  - variable: META_ADS_INSTAGRAM
    value: "collectionstaheri"
    availability: [RUNTIME]
