# Taheri — everything that differs from House of Mina. Applied on top of
# apphosting.yaml for the backend whose environment name is "taheri"
# (project gemstrack-pos). See the header of apphosting.yaml.
#
# Check the project id below before touching anything else: deployed with the
# wrong one, this app signs in against the other house's project and reads and
# writes the other house's database while showing Taheri's name on the door.

env:
  - variable: NEXT_PUBLIC_STORE_BRAND
    value: taheri
    availability:
      - BUILD
      - RUNTIME
  # Counter staff, for "Taken by" on orders and invoices.
  - variable: NEXT_PUBLIC_STORE_TAKEN_BY
    value: "Ammar,Murtaza,Huzaifa,Mansoor,Mohammad"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://pos.taheri.shop"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAl3W_9_Z9j0sR7rGIwwM1uiiXvOxGQ7IA"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "gemstrack-pos.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "gemstrack-pos"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "gemstrack-pos.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "948018742883"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:948018742883:web:a3a090dde378be96089a56"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_NAME
    value: "TAHERI"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_DEFAULT_METAL
    value: "gold"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_ALLOWED_EMAILS
    value: "potatomasta501@gmail.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_STORE_WHATSAPP_URL
    value: "https://wa.me/923262275554"
    availability:
      - BUILD
      - RUNTIME

  # Gates the notification endpoints, which Cloud Scheduler calls without a user
  # session. Its own value in this project, not shared with the other shop.
  - variable: NEXT_PUBLIC_OPEN_ACCESS
    value: "1"
    availability:
      - BUILD
      - RUNTIME

  # WhatsApp, through Green API. Deliberately the SAME instance House of Mina uses --
  # the shop runs one bot across both stores and its own env says so ("same as Mina --
  # shared bot"), so messages from either shop go out from the one number. That is the
  # arrangement, not an accident of copying: change it only if Taheri gets its own line.
  #
  # RUNTIME only. Read per request in src/lib/whatsapp.ts, never at build.
  - variable: NEXT_PUBLIC_STORE_WEBSITE_URL
    value: "https://taheri.shop"
    availability:
      - BUILD
      - RUNTIME

  # ── Selling from taheri.shop ──────────────────────────────────────────────
  # The public site quotes and checks out through /api/public/*. WEBSITE_ORIGIN
  # is the one origin those routes answer to, and where the catalogue's
  # attributes are read from. Leopards is optional: without its two secrets the
  # order page takes a consignment number by hand.
  - variable: WEBSITE_ORIGIN
    value: https://taheri.shop
    availability: [RUNTIME]
  # Add Photos: the bearer the POS presents to taheri.shop/api/upload.php. The
  # same value sits on Hostinger as ~/domains/taheri.shop/.website-upload-secret.
  # The Secret Manager entry is named in lowercase (it was created that way);
  # the variable the code reads is the uppercase one, and the two need not match.
  - variable: WEBSITE_UPLOAD_SECRET
    secret: website-upload-secret
    availability: [RUNTIME]
  # LEOPARDS_API_KEY and LEOPARDS_API_PASSWORD are deliberately NOT declared.
  # App Hosting refuses a rollout when a declared secret does not exist in
  # Secret Manager, and declaring them before their values existed is what
  # failed the 20 Sept build. Without them the order page takes a consignment
  # number by hand. Add each back here in the same commit that creates its
  # secret — and grant the three App Hosting service accounts secretAccessor
  # on it first, as the other secrets have, or the rollout fails on read.
  - variable: LEOPARDS_USE_SANDBOX
    value: "false"
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_STORE_INSTAGRAM_URL
    value: "https://www.instagram.com/collectionstaheri"
    availability:
      - BUILD
      - RUNTIME

  # ── Post a Piece (/website/post) ──────────────────────────────────────────
  # The announcements group of the "Taheri Collections" community (1,042
  # members; only admins write, and the Green API line +92 326 2275554 is one).
  # Not a secret — a chat id, read from Green API's getGroupData on 2026-09-24
  # (isCommunityAnnounce: true). Without it the page has no WhatsApp option.
  - variable: WHATSAPP_COMMUNITY_CHAT_ID
    value: "120363360668200388@g.us"
    availability: [RUNTIME]
  # The community's groups a post can go to from Posts → From the website, in the
  # order the page shows them (the first is the default). Read from WAHA on
  # 2026-09-25; the line is admin or super admin of every one. Label=chat id.
  - variable: WHATSAPP_POST_GROUPS
    value: "Announcements=120363360668200388@g.us,Diamonds=120363363549180252@g.us,Gemstones=120363375962914214@g.us,Investments=120363362406867247@g.us,Exclusives=120363423583500843@g.us,Watches=120363420544501251@g.us"
    availability: [RUNTIME]
  # The "Taheri Collections" WhatsApp channel (the line is its OWNER, 67 followers
  # on 2026-09-25, read through WAHA's /channels). With WAHA, every Post a Piece
  # WhatsApp send goes here too, after the community. Green API can't do channels.
  - variable: WHATSAPP_CHANNEL_ID
    value: "120363426877255473@newsletter"
    availability: [RUNTIME]
  # The channel's public link, for the page's "Open the WhatsApp channel".
  - variable: NEXT_PUBLIC_STORE_WA_CHANNEL_URL
    value: "https://whatsapp.com/channel/0029VbDHt507tkj3qtiehX0S"
    availability:
      - BUILD
      - RUNTIME
  # The numbers a post's caption asks customers to write to.
  - variable: NEXT_PUBLIC_STORE_WHATSAPP_NUMBERS
    value: "+923352275553, +923262275554"
    availability:
      - BUILD
      - RUNTIME
  # Post a Piece's AI (Gemini image + text models on Vertex, location global)
  # bills to Murtaza's "Jewel Gen" project, not this one. That project grants
  # this backend's service account (firebase-app-hosting-compute@gemstrack-pos)
  # roles/aiplatform.user; without the grant every AI button answers 403.
  - variable: IMAGE_AI_PROJECT
    value: "jewelgen-mm-e3d43ecb"
    availability: [RUNTIME]
  # Instagram stories post through "Instagram API with Instagram Login" — the
  # shop's Meta app, in development mode, with @collectionstaheri as its
  # Instagram tester. Only that account may be connected (src/lib/social/
  # instagram.ts). The app secret is in Secret Manager as instagram-app-secret,
  # readable by the three App Hosting accounts like CRON_SECRET; the token the
  # app earns on Connect lives in instagram-token, which only the runtime
  # account can read and add versions to. Redirect URI registered with Meta:
  # https://pos.taheri.shop/api/instagram/callback
  # INSTAGRAM_APP_ID is the *Instagram* app id from "API setup with Instagram
  # login" — not the Meta app id (1075984878628188) at the top of the dashboard.
  - variable: INSTAGRAM_USERNAME
    value: "collectionstaheri"
    availability: [RUNTIME]
  - variable: INSTAGRAM_APP_ID
    value: "1745196310046317"
    availability: [RUNTIME]
  # Where Instagram fetches story images from: the backend's own Google address,
  # which doesn't depend on the .shop registry (it went dark on 2026-09-24).
  - variable: SOCIAL_MEDIA_ORIGIN
    value: "https://studio--gemstrack-pos.us-central1.hosted.app"
    availability: [RUNTIME]
  # Investments by Taheri: the scheduled Claude routine files each day's post at
  # /api/investments with this token (it reads it from .pos-ingest-token in the
  # taheri-post-kit folder); the Investments page sends the post to this group.
  - variable: INVESTMENTS_GROUP_CHAT_ID
    value: "120363362406867247@g.us"
    availability: [RUNTIME]
  - variable: INVESTMENTS_INGEST_TOKEN
    secret: investments-ingest-token
    availability: [RUNTIME]
  # The Meta app itself (its dashboard id) — only for the checks panel's links to
  # the right settings pages.
  - variable: INSTAGRAM_META_APP_ID
    value: "1075984878628188"
    availability: [RUNTIME]
  - variable: INSTAGRAM_APP_SECRET
    secret: instagram-app-secret
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_STORE_LINKS_URL
    value: "https://links.taheri.shop"
    availability:
      - BUILD
      - RUNTIME

  # Orders & enquiries, in the order they print on invoices and workshop slips.
